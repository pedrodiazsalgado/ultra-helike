<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ultra Hélike</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ultra Hélike">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#161616">
<style>
html,body{margin:0;height:100%;background:#161616;font-family:system-ui,sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f2f6f7}
#fb{position:fixed;left:0;right:0;bottom:0;padding:8px;text-align:center;font-size:13px;background:#161616}
#fb a{color:#21eac6}
</style>
</head>
<body>
<!-- 1) Pega aquí la URL de tu app de Apps Script (termina en /exec) -->
<iframe id="app" title="Ultra Hélike 100K" allow="fullscreen"></iframe>
<div id="fb" hidden><a id="lk" target="_top">Abrir la app directamente</a></div>
<script>
const APP_URL='https://script.google.com/macros/s/AKfycbyTKlpR71odSe3EdmX_35TFV0qbTSZBHQx0ZDo8zczskFKaKMXN3aqRPlSA0XCH7nomdQ/exec';
const f=document.getElementById('app');
if(APP_URL.indexOf('https://')===0){f.src=APP_URL;const l=document.getElementById('lk');l.href=APP_URL;document.getElementById('fb').hidden=false;setTimeout(()=>document.getElementById('fb').hidden=true,6000)}
else document.body.insertAdjacentHTML('beforeend','<p style="color:#fff;padding:20px">Edita index.html y pega la URL de tu app en APP_URL.</p>');
</script>
</body>
</html>
